[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nishanttyagi-agenttrust"
version = "0.1.0"
description = "Thin evidence chain across policy, sealed effect, witness, and CI regression."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nishant Tyagi" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pydantic>=2.0,<3",
  "nishanttyagi-agenteval>=0.5.0,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
karmasakshi = ["karmasakshi-protocol>=0.2,<0.3"]

[project.scripts]
agenttrust-demo = "agenttrust.demo.run_demo:main"
agenttrust-report = "agenttrust.report.render:main"

[tool.setuptools]
packages = [
  "agenttrust.evidence",
  "agenttrust.importers",
  "agenttrust.gate",
  "agenttrust.ci",
  "agenttrust.demo",
  "agenttrust.report",
]

[tool.setuptools.package-dir]
"agenttrust.evidence" = "packages/evidence/agenttrust/evidence"
"agenttrust.importers" = "packages/importers/agenttrust/importers"
"agenttrust.gate" = "packages/gate/agenttrust/gate"
"agenttrust.ci" = "packages/ci/agenttrust/ci"
"agenttrust.demo" = "apps/demo"
"agenttrust.report" = "apps/report"

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "packages/evidence",
  "packages/importers",
  "packages/gate",
  "packages/ci",
]
