name: agenttrust

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,karmasakshi]"
      - name: Test
        run: python -m pytest -q
      - name: Demo
        run: python -m agenttrust.demo
      - name: Report
        run: python -m agenttrust.report evidence-pack/chain.json evidence-pack/report.html
      - name: Require evidence pack
        run: |
          test -s evidence-pack/chain.json
          test -s evidence-pack/report.html
      - name: Upload evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pack
          path: evidence-pack/
          if-no-files-found: error
