[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrust-stack"
version = "0.0.0"
description = "Thin evidence chain across policy, sealed effect, witness, and CI regression."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nishant Tyagi" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Private :: Do Not Upload",
]
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = { "" = "packages/evidence" }

[tool.setuptools.packages.find]
where = ["packages/evidence"]
include = ["agenttrust*"]

[tool.pytest.ini_options]
pythonpath = ["packages/evidence"]
