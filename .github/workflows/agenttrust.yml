name: agenttrust

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "pydantic>=2,<3" "pytest>=8,<9" "karmasakshi-protocol>=0.2,<0.3"
      - name: Test
        run: python -m pytest -q
